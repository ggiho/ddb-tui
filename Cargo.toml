[package]
name = "ddb-tui"
version = "0.1.0"
edition = "2024"
description = "A fast terminal UI for Amazon DynamoDB"
license = "MIT"
repository = "https://github.com/ggiho/ddb-tui"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.8.18", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.116.0"
base64 = "0.23.1"
# `Paragraph::line_count`, to size toasts and the PartiQL input around wrapped text.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
tokio = { version = "1.54.0", features = ["full"] }
unicode-width = "0.2.2"
